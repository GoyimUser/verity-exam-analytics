name: Android build and compatibility
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Build pure Python dependency and test Android dependency set
        run: |
          mkdir -p output/android-wheels
          SKIP_CYTHON=1 python -m pip wheel pydantic==1.10.24 --no-binary pydantic --no-deps --wheel-dir output/android-wheels
          python -m pip install output/android-wheels/*.whl fastapi==0.125.0 starlette==0.50.0 uvicorn==0.35.0 python-multipart==0.0.32 openpyxl==3.1.5 httpx==0.28.1 playwright==1.64.1
          python -m unittest discover -s tests -v
      - name: Build isolated QA APK and run Android lint
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x android/gradlew
          VERITY_BUILD_PYTHON=$(which python) android/gradlew -p android assembleDebug lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: verity-android-qa
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
