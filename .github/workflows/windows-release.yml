name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-windows.txt
          npm ci
          npx playwright install firefox webkit
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Frontend logic tests
        run: |
          npm test
          npm run lint
          npm run calendar
      - name: Isolated browser, accessibility and reporting workflows
        run: |
          npm run test:browser
          node scripts/settings_check.cjs
          python -m tests.check_exam_pdf
      - name: Build and smoke-test Windows executable
        run: |
          python scripts/build_windows.py
          python scripts/build_installer.py
          python scripts/test_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: verity-windows-x64
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: output/playwright/completion/
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME release/* --title "Verity $env:GITHUB_REF_NAME — Windows x64" --notes-file RELEASE_NOTES.md --prerelease --verify-tag
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
          exit 0
